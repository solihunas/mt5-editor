<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MT5 Riwayat — Demo Edukasi Anti-Penipuan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,'Roboto','Segoe UI',Arial,sans-serif;}
html,body{background:radial-gradient(ellipse at top left,#1a0830 0%,#08000f 55%,#000000 100%);display:flex;flex-direction:column;align-items:center;min-height:100vh;}

#ctrlbar{width:100%;max-width:420px;background:rgba(8,0,20,0.9);display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(140,60,255,0.2);}
.ctrl{border:1px solid rgba(140,60,255,0.25);border-radius:8px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;color:#9a85c0;background:rgba(20,5,40,0.8);text-align:center;transition:.15s;}
.ctrl:active{filter:brightness(1.3);}
.ctrl.dl{background:rgba(40,140,90,0.4);border-color:rgba(60,200,120,0.4);color:#6de8a0;}
.ctrl.rs{margin-left:auto;background:rgba(50,15,25,0.6);border-color:rgba(180,60,80,0.3);color:#e09098;}
.hint{color:#9a85c0;font-size:11px;padding:8px 12px;text-align:center;max-width:420px;background:rgba(5,0,15,.6);line-height:1.5;}
.hint b{color:#d0b0ff;}

#photowrap{position:relative;width:406px;background:#fff;}
#photowrap img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;pointer-events:none;}

.mbox{position:absolute;background:#fff;display:flex;align-items:center;overflow:hidden;outline:1px dashed rgba(10,132,255,.4);outline-offset:-1px;}
.mbox.right{justify-content:flex-end;}
.mbox.left{justify-content:flex-start;}
.mtxt{width:100%;overflow:hidden;white-space:nowrap;cursor:pointer;text-overflow:clip;}
.mtxt.f-sval{font-size:15px;font-weight:700;padding-right:2px;}
.mtxt.f-price{font-size:12.5px;font-weight:400;padding-left:2px;}
.mtxt.f-date{font-size:10.5px;font-weight:400;padding-right:2px;}
.mtxt.f-pnl{font-size:15px;font-weight:700;padding-right:2px;}

.cc0{color:#1c1c1c!important;}.cc1{color:#0a84ff!important;}.cc2{color:#e0322e!important;}.cc3{color:#8e8e93!important;}
body:not(.cap) .mtxt:hover{background:rgba(10,132,255,.1);}
body.cap .mbox{outline:none!important;}

#epop{position:fixed;z-index:900;background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.3);min-width:235px;max-width:300px;display:none;border:1px solid #e8e8e8;}
#epop .eplbl{font-size:11px;color:#8e8e93;margin-bottom:7px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;}
#einput{width:100%;border:1.5px solid #0a84ff;border-radius:9px;padding:8px 11px;font-size:15px;color:#1c1c1c;outline:none;margin-bottom:12px;}
.swrow{display:flex;gap:11px;margin-bottom:13px;align-items:center;}
.swrow .swlbl{font-size:11px;color:#8e8e93;font-weight:500;width:40px;}
.sw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .15s;flex-shrink:0;}
.sw:active{transform:scale(1.25);}
.sw.sel{border-color:#000;transform:scale(1.2);}
.sw0{background:#1c1c1c;}.sw1{background:#0a84ff;}.sw2{background:#e0322e;}.sw3{background:#8e8e93;}
.epbrow{display:flex;gap:8px;}
.epok{flex:1;background:#0a84ff;color:#fff;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;}
.epcancel{flex:1;background:#f2f2f7;color:#1c1c1c;border:none;border-radius:9px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;}
.epclear{flex:1;background:#fff0f0;color:#e0322e;border:1px solid #f0c8c8;border-radius:9px;padding:9px;font-size:13px;font-weight:600;cursor:pointer;}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;}
#modal .mtit{color:#d0b0ff;font-size:14px;margin-bottom:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
#modal .mwrap{max-width:100%;max-height:66vh;overflow:auto;border-radius:10px;box-shadow:0 12px 50px rgba(100,30,200,.4);border:1px solid rgba(140,60,255,0.3);}
#modal img{display:block;max-width:100%;}
#modal .mbtns{display:flex;gap:10px;margin-top:14px;}
#modal .mbtn{border:none;border-radius:10px;padding:12px 26px;font-size:14px;font-weight:700;cursor:pointer;}
#modal .msave{background:linear-gradient(135deg,#30d158,#20a040);color:#fff;}
#modal .mclose{background:rgba(60,20,90,0.8);color:#c8a0ff;border:1px solid rgba(140,60,255,0.3);}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:5px;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="ctrlbar">
  <button class="ctrl dl" id="dlbtn" onclick="doDownload()">⬇ HD</button>
  <button class="ctrl rs" onclick="resetProject()" title="Hapus data tersimpan & mulai baru">↻ Baru</button>
</div>
<div class="hint">Foto asli riwayat MT5 — semua <b>nominal ditutup putih</b>. Ketuk kotak putih (garis putus biru) untuk isi contoh nilai demo. Tujuan: edukasi supaya tidak mudah tertipu screenshot profit palsu.</div>

<div id="photowrap">
  <img src="assets/riwayat-real.jpg" alt="Riwayat MT5">
  <!-- overlay boxes digenerate oleh JS -->
</div>

<!-- EDIT POPUP -->
<div id="epop">
  <div class="eplbl">Isi nilai demo</div>
  <input id="einput" type="text" placeholder="Ketik nilai...">
  <div class="swrow"><span class="swlbl">Warna:</span>
    <div class="sw sw0 sel" data-ci="0" onclick="pickColor(0)"></div>
    <div class="sw sw1" data-ci="1" onclick="pickColor(1)"></div>
    <div class="sw sw2" data-ci="2" onclick="pickColor(2)"></div>
    <div class="sw sw3" data-ci="3" onclick="pickColor(3)"></div>
  </div>
  <div class="epbrow"><button class="epok" onclick="applyEp()">OK</button><button class="epclear" onclick="clearEp()">Kosongkan</button><button class="epcancel" onclick="closeEp()">Batal</button></div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="mtit">Preview HD</div>
  <div class="mwrap"><img id="mimg"></div>
  <div class="mbtns"><button class="mbtn msave" onclick="saveImg()">⬇ Simpan</button><button class="mbtn mclose" onclick="document.getElementById('modal').style.display='none'">✕ Tutup</button></div>
</div>

<script>
/* Dimensi foto asli (px) — semua koordinat kotak dihitung relatif terhadap ini */
const IMG_W=1220, IMG_H=2712;
function pct(v,total){return (v/total*100)+'%';}

/* Kotak ringkasan (Keuntungan/Deposito/Swap/Komisi/Saldo) — sisi kanan tetap
   di tepi asli (1185), sisi kiri dilebarkan ke area titik-titik kosong supaya
   nilai demo yang lebih panjang dari aslinya tidak terpotong */
const SUM_L=750, SUM_W=435;
const summaryBoxes=[
 {id:'keuntungan',left:SUM_L,top:455,width:SUM_W,height:50,font:'f-sval',dc:2},
 {id:'deposito',  left:SUM_L,top:530,width:SUM_W,height:50,font:'f-sval',dc:0},
 {id:'swap',      left:SUM_L,top:605,width:SUM_W,height:50,font:'f-sval',dc:0},
 {id:'komisi',    left:SUM_L,top:680,width:SUM_W,height:50,font:'f-sval',dc:0},
 {id:'saldo',     left:SUM_L,top:755,width:SUM_W,height:50,font:'f-sval',dc:0},
];

/* top-y (price line & date/pnl line) untuk 10 baris transaksi, diukur langsung dari foto asli */
const rowTops=[
 [918,870],[1068,1020],[1206,1158],[1353,1305],[1503,1455],
 [1648,1600],[1798,1750],[1926,1878],[2076,2028],[2226,2178],
];
/* lebar kotak dilonggarkan ke area kosong sekitarnya agar nilai demo yang
   lebih panjang tidak terpotong, tanpa menimpa teks lain di foto */
const PRICE_L=8, PRICE_W=630, DATE_L=500, DATE_W=685, PNL_L=650, PNL_W=535, ROW_H=46;

const rowBoxes=[];
rowTops.forEach((t,i)=>{
  const [priceTop,dateTop]=t;
  rowBoxes.push({id:'price'+i,left:PRICE_L,top:priceTop-6,width:PRICE_W,height:ROW_H,font:'f-price',dc:3,align:'left'});
  rowBoxes.push({id:'date'+i, left:DATE_L, top:dateTop-6, width:DATE_W, height:ROW_H,font:'f-date', dc:3,align:'right'});
  rowBoxes.push({id:'pnl'+i,  left:PNL_L,  top:priceTop-6,width:PNL_W,  height:ROW_H,font:'f-pnl',  dc:1,align:'right'});
});

const CLS=['cc0','cc1','cc2','cc3'];
const allBoxes=[...summaryBoxes,...rowBoxes];

function renderBoxes(){
  const wrap=document.getElementById('photowrap');
  allBoxes.forEach(b=>{
    const align=b.align||'right';
    const div=document.createElement('div');
    div.className='mbox '+align;
    div.style.left=pct(b.left,IMG_W);
    div.style.top=pct(b.top,IMG_H);
    div.style.width=pct(b.width,IMG_W);
    div.style.height=pct(b.height,IMG_H);
    div.innerHTML=`<span class="mtxt ${b.font} ed ${CLS[b.dc]}" id="box-${b.id}" data-c="${b.dc}" onclick="ep(this)"></span>`;
    wrap.appendChild(div);
  });
}

let curEl=null,pendingC=0,pendingCb=null;
function ep(el){
  openPop(el,parseInt(el.getAttribute('data-c')||'0'),(t,ci)=>{
    el.textContent=t;setC(el,ci);el.setAttribute('data-c',ci);saveProject();
  });
}
function openPop(el,ci,cb){
  curEl=el;pendingC=ci;pendingCb=cb;
  const pop=document.getElementById('epop');
  document.getElementById('einput').value=el.textContent.trim();
  hlSw(ci);pop.style.display='block';
  const r=el.getBoundingClientRect();const pw=245;
  let top=r.bottom+window.scrollY+6,left=r.left+window.scrollX;
  if(left+pw>window.innerWidth-8)left=window.innerWidth-pw-8;
  if(left<8)left=8;
  pop.style.top=top+'px';pop.style.left=left+'px';
  setTimeout(()=>document.getElementById('einput').focus(),40);
}
function pickColor(ci){pendingC=ci;hlSw(ci);}
function hlSw(ci){document.querySelectorAll('#epop .sw').forEach(s=>s.classList.toggle('sel',parseInt(s.dataset.ci)===ci));}
function applyEp(){if(pendingCb)pendingCb(document.getElementById('einput').value,pendingC);closeEp();}
function clearEp(){if(pendingCb)pendingCb('',pendingC);closeEp();}
function closeEp(){document.getElementById('epop').style.display='none';curEl=null;pendingCb=null;}
function setC(el,ci){CLS.forEach(c=>el.classList.remove(c));el.classList.add(CLS[ci]);}

document.addEventListener('click',e=>{const pop=document.getElementById('epop');if(pop.style.display==='block'&&!pop.contains(e.target)&&e.target!==curEl&&!(curEl&&curEl.contains(e.target)))closeEp();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEp();if(e.key==='Enter'&&document.getElementById('epop').style.display==='block')applyEp();});

/* Download HD */
let lastURL=null;
async function doDownload(){
  closeEp();
  const btn=document.getElementById('dlbtn');const o=btn.innerHTML;btn.innerHTML='<span class="spin"></span>';btn.disabled=true;
  document.body.classList.add('cap');
  try{
    const cvs=await html2canvas(document.getElementById('photowrap'),{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
    lastURL=cvs.toDataURL('image/png');
    document.getElementById('mimg').src=lastURL;
    document.getElementById('modal').style.display='flex';
  }catch(e){alert('Error: '+e.message);}
  document.body.classList.remove('cap');btn.innerHTML=o;btn.disabled=false;
}
function saveImg(){if(!lastURL)return;const a=document.createElement('a');a.href=lastURL;a.download='mt5-riwayat-demo-HD.png';a.click();}

/* Simpan/muat isian ke localStorage supaya tidak hilang saat reload */
const PROJ_KEY='mt5_riwayat_photo_v1';
let _projectLoaded=false,_saveTimer=null;
function saveProject(){
  if(!_projectLoaded)return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    const data={};
    allBoxes.forEach(b=>{const el=document.getElementById('box-'+b.id);data[b.id]={t:el.textContent,c:el.getAttribute('data-c')};});
    localStorage.setItem(PROJ_KEY,JSON.stringify(data));
  },300);
}
function loadProject(){
  let data=null;
  try{data=JSON.parse(localStorage.getItem(PROJ_KEY)||'null');}catch(e){}
  if(data){
    allBoxes.forEach(b=>{
      const el=document.getElementById('box-'+b.id);
      const v=data[b.id];
      if(v){el.textContent=v.t;setC(el,parseInt(v.c));el.setAttribute('data-c',v.c);}
    });
  }
  _projectLoaded=true;
}
function resetProject(){
  if(!confirm('Hapus semua isian demo & mulai baru? Tindakan ini tidak bisa dibatalkan.'))return;
  localStorage.removeItem(PROJ_KEY);
  location.reload();
}

renderBoxes();
loadProject();
</script>
</body>
</html>
